<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dashboard</title>
    <meta name="description" content="Quests, inbox and focus timer." />
    <meta name="theme-color" content="#1D2B53" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Scripts run only from here and the sync library's CDN: a crafted backup or synced row
         can't smuggle one in. (GitHub Pages can't send headers, so it's set here.) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="js/theme.js"></script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="now">
          <div class="hnowin" id="hnow"></div>
        </div>
        <div class="hbar">
          <div class="hact" id="hact"></div>
          <div class="hbtns">
            <button class="hsearch" id="searchBtn" aria-label="Search"><svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M1 0h4v1H1zM0 1h1v4H0zM5 1h1v4H5zM1 5h4v1H1zM5 5h1v1H5zM6 6h1v1H6zM7 7h1v1H7z"/></svg></button>
            <button class="syncbtn" id="syncBtn" aria-live="polite"><span class="sr">Sync off</span></button>
          </div>
        </div>
        <div
          class="hprog"
          role="progressbar"
          aria-label="Today's quests done"
          aria-valuemin="0"
          aria-valuemax="100"
          id="hprog"
        >
          <div id="hfill"></div>
        </div>
        <div class="hfoot"><div class="hstats" id="hstats"></div></div>
      </header>

      <section id="v-today"></section>
      <section id="v-inbox" hidden></section>
      <section id="v-waiting" hidden></section>
      <section id="v-review" hidden></section>
      <section id="v-projects" hidden></section>
      <section id="v-focus" hidden></section>
      <section id="v-log" hidden></section>
      <section id="v-notes" hidden></section>
      <section id="v-knowledge" hidden></section>
      <section id="v-search" hidden></section>
      <section id="v-account" hidden></section>
    </div>

    <nav aria-label="Sections">
      <div class="tabs" id="tabs">
        <button data-v="today" aria-current="page">Today</button>
        <button data-v="inbox">Inbox<span class="badge" id="inboxBadge" hidden></span></button>
        <button data-v="knowledge">Knowledge<span class="badge" id="waitBadge" hidden></span></button>
        <button data-v="review">
          Review<span class="dot" id="reviewDot" hidden role="img" aria-label="weekly review due"></span>
        </button>
        <button data-v="account">Settings</button>
      </div>
    </nav>
    <section id="v-zen" hidden aria-label="Single-task mode"></section>
    <section id="v-talk" hidden aria-label="Talk mode"></section>
    <section id="v-alarm" hidden aria-label="Alarm" role="alertdialog" aria-modal="true"></section>
    <div class="toast" id="toast" role="status"></div>
    <script src="config.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"
      integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6"
      crossorigin="anonymous"
    ></script>

    <script src="js/state.js"></script>
    <script src="js/pics.js"></script>
    <script src="js/tree.js"></script>
    <script src="js/records.js"></script>
    <script src="js/header.js"></script>
    <script src="js/today.js"></script>
    <script src="js/inbox.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/waiting.js"></script>
    <script src="js/review.js"></script>
    <script src="js/health.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/history.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/capture.js"></script>
    <script src="js/notify.js"></script>
    <script src="js/board.js"></script>
    <script src="js/talk.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/knowledge.js"></script>
    <script src="js/search.js"></script>
    <script src="js/alarms.js"></script>
    <script src="js/events.js"></script>
  </body>
</html>
