<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <!-- Not viewport-fit=cover: with it, Android Chrome draws the page behind the system bars and
         reports their height as a safe-area inset that changes as its address bar shows and hides,
         so the tab bar (padded by it) grew at the top of the page and jumped while scrolling. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <meta name="description" content="Your work in one calm place: tasks, processes, waiting and focus." />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Scripts run only from here and the sync library's CDN: a crafted backup or synced row
         can't smuggle one in. (GitHub Pages can't send headers, so it's set here.) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="styles.css" />
    <script src="js/theme.js"></script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="now">
          <div class="hnowin" id="hnow"></div>
        </div>
        <div class="hbar">
          <div class="hact" id="hact"></div>
          <div class="hbtns">
            <button class="hsearch" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
            <button class="syncbtn" id="syncBtn" aria-live="polite"><span class="sr">Sync off</span></button>
          </div>
        </div>
        <div
          class="hprog"
          role="progressbar"
          aria-label="Today's quests done"
          aria-valuemin="0"
          aria-valuemax="100"
          id="hprog"
        >
          <div id="hfill"></div>
        </div>
        <div class="hfoot"><div class="hstats" id="hstats"></div></div>
      </header>

      <section id="v-today"></section>
      <section id="v-inbox" hidden></section>
      <section id="v-waiting" hidden></section>
      <section id="v-review" hidden></section>
      <section id="v-focus" hidden></section>
      <section id="v-log" hidden></section>
      <section id="v-notes" hidden></section>
      <section id="v-knowledge" hidden></section>
      <section id="v-search" hidden></section>
      <section id="v-account" hidden></section>
      <section id="v-ops" hidden aria-label="Command Centre"></section>
    </div>

    <nav aria-label="Sections">
      <div class="tabs" id="tabs">
        <button data-v="today" aria-current="page">Today</button>
        <button data-v="inbox">Inbox<span class="badge" id="inboxBadge" hidden></span></button>
        <button data-v="knowledge">Knowledge<span class="badge" id="waitBadge" hidden></span></button>
        <button data-v="review">
          Review<span class="dot" id="reviewDot" hidden role="img" aria-label="weekly review due"></span>
        </button>
        <button data-v="account">Settings</button>
      </div>
    </nav>
    <section id="v-zen" hidden aria-label="Single-task mode"></section>
    <section id="v-alarm" hidden aria-label="Alarm" role="alertdialog" aria-modal="true"></section>
    <div class="toast" id="toast" role="status"></div>
    <script src="config.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"
      integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6"
      crossorigin="anonymous"
    ></script>

    <script src="js/state.js"></script>
    <script src="js/pics.js"></script>
    <script src="js/tree.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/records.js"></script>
    <script src="js/header.js"></script>
    <script src="js/today.js"></script>
    <script src="js/inbox.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/waiting.js"></script>
    <script src="js/review.js"></script>
    <script src="js/health.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/history.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/capture.js"></script>
    <script src="js/notify.js"></script>
    <script src="js/board.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/knowledge.js"></script>
    <script src="js/search.js"></script>
    <script src="js/alarms.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/resume.js"></script>
    <script src="js/top3.js"></script>
    <script src="js/links.js"></script>
    <script src="js/triage.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/procedures.js"></script>
    <script src="js/execs.js"></script>
    <script src="js/domain.js"></script>
    <script src="js/workflows.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/forecast.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/ops.js"></script>
    <script src="js/create.js"></script>
    <script src="js/events.js"></script>
  </body>
</html>
