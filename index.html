<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Cockpit</title>
<meta name="description" content="Quests, inbox and focus timer.">
<meta name="theme-color" content="#1D2B53">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF1E8; --panel:#FFFFFF; --ink:#1D2B53; --muted:#5F574F; --edge:#1D2B53;
  --yellow:#FFEC27; --pink:#FF77A8; --green:#00E436; --orange:#FFA300; --blue:#29ADFF; --plum:#7E2553;
  --on-accent:#1D2B53;
  --display:"Press Start 2P", "Courier New", monospace;
  --body:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1D2B53; --panel:#29366F; --ink:#FFF1E8; --muted:#C2C3C7; --edge:#000000; }
}
:root[data-theme="dark"]{ --bg:#1D2B53; --panel:#29366F; --ink:#FFF1E8; --muted:#C2C3C7; --edge:#000000; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;scrollbar-gutter:stable}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--yellow);outline-offset:3px}

.wrap{max-width:520px;margin:0 auto;padding:16px 16px 110px}

/* header */
header{background:var(--plum);color:#FFF1E8;border:3px solid var(--edge);box-shadow:5px 5px 0 var(--edge);padding:12px 14px;margin-bottom:22px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.title{font-family:var(--display);font-size:12px;letter-spacing:1px;margin:0}
.now{display:flex;align-items:center;gap:10px;margin:12px 0 10px;min-height:34px}
.now .check{border-color:var(--edge)}
.now .go{flex:1;min-width:0;background:none;border:0;padding:0;color:#FFF1E8;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.now .go small{display:block;font-size:14px;opacity:.8}
.now .go b{font-weight:600}
.now .clk{font-family:var(--display);font-size:16px}
.now .btn{padding:6px 10px;font-size:15px}
.hprog{height:12px;border:3px solid var(--edge);background:#1D2B53}
.hprog div{height:100%;background:var(--green);transition:width .3s steps(6)}
.hstats{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:6px;font-size:15px}
.hstats button{background:none;border:0;padding:2px 0;color:#FFF1E8;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,241,232,.4)}
.hstats .warn{color:var(--on-accent);background:var(--pink);border:2px solid var(--edge);padding:0 5px;text-decoration:none}
.syncbtn{background:none;border:2px solid #FFF1E8;color:#FFF1E8;padding:1px 8px;font-size:15px;cursor:pointer;white-space:nowrap}
.syncbtn[data-state="ok"]{background:var(--green);color:var(--on-accent);border-color:var(--edge)}
.syncbtn[data-state="offline"]{background:var(--orange);color:var(--on-accent);border-color:var(--edge)}
.syncbtn[data-state="error"]{background:var(--pink);color:var(--on-accent);border-color:var(--edge)}
.msg{margin:14px 0 0}
label.btn{display:inline-block}
@media (min-width:900px){.wrap{max-width:640px;padding-top:32px}}

h2{font-family:var(--display);font-size:13px;line-height:1.6;margin:0 0 6px}
.hint{color:var(--muted);margin:0 0 16px;font-size:16px}

/* blocks */
.box{background:var(--panel);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
.btn{background:var(--yellow);color:var(--on-accent);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:10px 14px;cursor:pointer;font-weight:600}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:3px 3px 0 var(--edge)}
.btn.pink{background:var(--pink)} .btn.green{background:var(--green)} .btn.blue{background:var(--blue)}

/* quests */
.quest{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:14px}
.check{flex:none;width:34px;height:34px;border:3px solid var(--edge);background:var(--bg);cursor:pointer;padding:0;display:grid;place-items:center}
.quest.done .check,.row.done .check{background:var(--green)}
.check svg{width:18px;height:18px;visibility:hidden}
.quest.done .check svg,.row.done .check svg{visibility:visible}
.quest .txt{flex:1;overflow-wrap:anywhere}
.quest.done .txt{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.slot{border:3px dashed var(--muted);padding:14px;margin-bottom:14px;color:var(--muted)}
.addrow{display:flex;gap:10px;margin-bottom:14px}
.addrow input{flex:1;min-width:0;padding:10px;background:var(--panel);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.addrow input::placeholder{color:var(--muted)}

.clear{background:var(--yellow);color:var(--on-accent);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);padding:16px;text-align:center;margin-bottom:18px}
.clear b{display:block;font-family:var(--display);font-size:15px;margin-bottom:8px;animation:blink 1s steps(2) 3}
@keyframes blink{50%{opacity:0}}

/* inbox */
.item{padding:12px;margin-bottom:12px}
.item p{margin:0 0 10px;overflow-wrap:anywhere}
.item .row{display:flex;gap:10px}
.item .btn{padding:6px 10px;font-size:16px}
.item .subs{list-style:none;margin:0 0 10px;padding:0}
.item .subs li{display:flex;align-items:center;gap:6px;border-top:2px dashed var(--muted);padding:4px 0 4px 10px;overflow-wrap:anywhere}
.item .subs li span{flex:1}
.item .subs .x{font-size:20px;padding:2px 8px}
.item .addrow{margin:0 0 10px}
.item .addrow input{padding:6px 8px;box-shadow:none}
.mic{flex:none;width:48px;padding:0;display:grid;place-items:center}
.mic svg{width:22px;height:24px}
.mic.on{background:var(--pink);animation:blink 1s steps(2) infinite}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

/* focus */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.chip{border:3px solid var(--edge);background:var(--panel);padding:8px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--yellow));color:var(--on-accent);box-shadow:3px 3px 0 var(--edge)}
.clock{font-family:var(--display);font-size:clamp(36px,13vw,56px);text-align:center;padding:26px 8px 18px;margin-bottom:16px}
.clock small{display:block;font-family:var(--body);font-size:18px;margin-top:14px;color:var(--muted)}
.bars{padding:14px;margin-top:22px}
.bar{display:grid;grid-template-columns:78px 1fr 64px;gap:8px;align-items:center;margin:8px 0;font-size:16px}
.track{height:16px;background:var(--bg);border:2px solid var(--edge)}
.track div{height:100%}
.bar span:last-child{text-align:right}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:3px solid var(--edge);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
nav button{flex:1 1 auto;min-width:0;max-width:140px;background:none;border:3px solid transparent;padding:8px 2px;cursor:pointer;font-weight:600;font-size:16px}
nav .gear{flex:0 0 52px;display:grid;place-items:center}
@media (max-width:374px){nav{gap:2px;padding-left:4px;padding-right:4px}nav button{font-size:14px;padding:8px 1px}nav .gear{flex-basis:40px}nav .badge{min-width:18px;margin-left:2px;padding:0 2px;font-size:12px}}
nav .gear svg{width:22px;height:22px}
nav button[aria-current="page"]{background:var(--yellow);color:var(--on-accent);border-color:var(--edge)}
.badge{display:inline-block;min-width:22px;margin-left:4px;padding:0 4px;background:var(--pink);color:var(--on-accent);border:2px solid var(--edge);font-size:14px}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--green);color:var(--on-accent);font-family:var(--display);font-size:12px;padding:10px 14px;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
.back{margin-bottom:12px;padding:6px 12px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:14px;font-size:16px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:2px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.crumbs b{color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:12px}
.open{flex:1;min-width:0;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.open small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.row.done .open>span{text-decoration:line-through;color:var(--muted)}
.chev{font-family:var(--display);font-size:12px;color:var(--muted)}
.meter{flex:none;width:34px;height:34px;border:3px solid var(--edge);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--on-accent);cursor:pointer;padding:0}
.tag{display:inline-block;border:2px solid var(--edge);padding:0 5px;font-size:14px;margin-right:4px;color:var(--on-accent)}
.tag.opt{background:var(--blue)} .tag.rep{background:var(--green)} .tag.due{background:var(--yellow)} .tag.late{background:var(--pink)} .tag.now{background:var(--orange)}
.node{padding:14px;margin-bottom:22px}
.node h1{font-family:var(--display);font-size:15px;line-height:1.6;margin:0 0 12px;overflow-wrap:anywhere}
.prog{height:18px;border:3px solid var(--edge);background:var(--bg);margin:6px 0}
.prog div{height:100%;background:var(--green)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.node .acts .btn{flex:1 1 0;min-width:0;padding:10px 6px}
.x.armed{font-size:15px;font-weight:600;background:var(--pink);color:var(--on-accent);border:2px solid var(--edge);padding:6px 8px}
.dellink.armed{font-weight:600;text-decoration:none;background:var(--pink);color:var(--on-accent);border:2px solid var(--edge);padding:6px 10px;margin-top:12px}
.dellink{display:block;background:none;border:0;padding:8px 0 0;margin-top:6px;color:var(--pink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:16px}
details{margin-top:14px;border-top:3px dashed var(--muted);padding-top:10px}
summary{cursor:pointer;font-weight:600}
label.f{display:block;margin:12px 0 4px;font-size:16px;color:var(--muted)}
.fld{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;padding:10px;background:var(--bg);border:3px solid var(--edge);border-radius:0}
input[type=date].fld{-webkit-appearance:none;appearance:none;min-height:50px;text-align:left}
input[type=date].fld::-webkit-date-and-time-value{text-align:left}
details,details>*{box-sizing:border-box}
textarea.fld{min-height:90px;resize:vertical}
.optbox{display:flex;align-items:center;gap:8px;margin-top:12px}
.optbox input{width:22px;height:22px;accent-color:var(--blue)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:16px}
.links{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:10px}
.links .dellink{margin:0;padding:6px 0}
.listbar{display:flex;justify-content:flex-end;margin:-6px 0 6px}
.mv[data-top]{width:auto;padding:0 8px;font-weight:600}
.mv{flex:none;width:36px;height:36px;border:3px solid var(--edge);background:var(--yellow);color:var(--on-accent);cursor:pointer;padding:0;font-size:14px}
.mv[disabled]{opacity:.3;cursor:default}
.soon{padding:12px 14px;margin-bottom:22px;border-color:var(--edge);background:var(--panel)}
.soonrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:2px dashed var(--muted);padding:10px 0;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.soonrow:first-of-type{border-top:0}
.soonrow .tag{flex:none;margin:0}
.tpls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-2px 0 18px}
.tchip{display:inline-flex;border:3px solid var(--edge);background:var(--panel);box-shadow:3px 3px 0 var(--edge)}
.tchip button{background:none;border:0;padding:6px 10px;cursor:pointer}
.tchip .tdel{border-left:2px solid var(--edge);color:var(--muted);padding:6px 8px}
.tchip .tdel.armed{background:var(--pink);color:var(--on-accent);font-weight:600}
.backup{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin-top:30px;padding-top:12px;border-top:3px dashed var(--muted);color:var(--muted);font-size:16px}
.backup span{flex-basis:100%}
.backup label{cursor:pointer}
.banner{padding:14px;margin-bottom:22px;background:var(--panel)}
.banner p{margin:0}
/* undo toast, log, repeat days, tags, stats range */
.toast.act{pointer-events:auto}
.toast button{margin-left:10px;background:var(--yellow);color:var(--on-accent);border:2px solid var(--edge);font-family:var(--display);font-size:11px;padding:6px 8px;cursor:pointer}
.day{width:34px;height:34px;padding:0;border:2px solid var(--edge);background:var(--panel);cursor:pointer;font-size:14px}
.day[aria-pressed="true"]{background:var(--blue);color:var(--on-accent);font-weight:600}
.rep{padding:10px 0;border-top:2px dashed var(--muted)}
.rep:first-of-type{border-top:0}
.rep>span{display:block;margin-bottom:6px;overflow-wrap:anywhere}
.days{display:flex;flex-wrap:wrap;gap:6px}
.tagrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.tagrow .fld{flex:1;padding:6px 8px}
.sw{flex:none;width:22px;height:22px;border:2px solid var(--edge)}
.x[disabled]{opacity:.3;cursor:default}
.rng{margin-bottom:10px}
.rng .chip{padding:4px 10px;font-size:15px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logday{padding:12px 14px;margin-bottom:16px}
.logday h2{display:flex;justify-content:space-between;gap:8px}
.logday h2 small{font-family:var(--body);font-size:15px;color:var(--muted);font-weight:400}
.logday ul{margin:6px 0 0;padding-left:20px}
.logday li{margin:4px 0;overflow-wrap:anywhere}
.logday li small{color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow"><p class="title">Work Cockpit</p><button class="syncbtn" id="syncBtn">Sync off</button></div>
    <div class="now" id="hnow"></div>
    <div class="hprog" role="progressbar" aria-label="Today's quests done" aria-valuemin="0" aria-valuemax="100" id="hprog"><div id="hfill"></div></div>
    <div class="hstats" id="hstats"></div>
  </header>

  <section id="v-today"></section>
  <section id="v-inbox" hidden></section>
  <section id="v-focus" hidden></section>
  <section id="v-log" hidden></section>
  <section id="v-account" hidden></section>
</div>

<nav aria-label="Sections">
  <button data-v="today" aria-current="page">Today</button>
  <button data-v="inbox">Inbox<span class="badge" id="inboxBadge" hidden></span></button>
  <button data-v="focus">Focus</button>
  <button data-v="log">History</button>
  <button data-v="account" class="gear" aria-label="Settings" title="Settings"><svg viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h3v1H3zM1 1h1v1H1zM3 1h3v1H3zM7 1h1v1H7zM2 2h5v1H2zM0 3h4v1H0zM5 3h4v1H5zM0 4h3v1H0zM6 4h3v1H6zM0 5h4v1H0zM5 5h4v1H5zM2 6h5v1H2zM1 7h1v1H1zM3 7h3v1H3zM7 7h1v1H7zM3 8h3v1H3z"/></svg></button>
</nav>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"></script>

<script>
const KEY='work-cockpit-v1';
const TAGS=[['Design','var(--pink)'],['Meetings','var(--blue)'],['Admin','var(--orange)'],['Delivery','var(--green)']];
const PALETTE=['var(--pink)','var(--blue)','var(--orange)','var(--green)','var(--yellow)','#C2C3C7'];
const TITLE='Work Cockpit';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const shift=(ds,n)=>{const [y,m,d]=ds.split('-').map(Number);return fmt(new Date(y,m-1,d+n));};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const niceDate=ds=>{const [y,m,d]=ds.split('-').map(Number);return d+' '+MON[m-1];};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK=[1,2,3,4,5,6,0];
const dayLabel=ds=>{if(ds===today())return 'Today';if(ds===shift(today(),-1))return 'Yesterday';const [y,m,d]=ds.split('-').map(Number);return WD[new Date(y,m-1,d).getDay()]+' '+d+' '+MON[m-1];};

let S;
function fix(n){n.children=(n.children||[]).map(fix);n.tag=n.tag||'';n.opt=!!n.opt;n.notes=n.notes||'';n.due=n.due||'';n.done=!!n.done;return n;}
function norm(s){
  S=Object.assign({xp:0,day:today(),quests:[],inbox:[],sessions:[],templates:[],bonusDay:'',timer:null,tag:'Design',mins:25,focusQ:null,log:[],tags:null,daily:null},s||{});
  delete S.streak;
  S.quests=S.quests.map(fix);
  S.inbox=S.inbox.map(i=>i.node?Object.assign(i,{node:fix(i.node)}):i);
  S.templates.forEach(t=>{if(!Array.isArray(t.days))t.days=[];t.monthDay=t.monthDay||0;});
  if(!Array.isArray(S.tags)||!S.tags.length) S.tags=TAGS.map(([name,color])=>({name,color}));
  if(!S.daily){S.daily={};S.sessions.forEach(x=>addDaily(fmt(new Date(x.t)),x.tag,x.mins));}
}
function addDaily(d,tag,mins){const o=S.daily[d]=S.daily[d]||{};o[tag]=(o[tag]||0)+mins;}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}norm(s);}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){
  const cut=Date.now()-60*864e5,dcut=shift(today(),-400),lcut=shift(today(),-120);
  S.sessions=S.sessions.filter(x=>x.t>cut);
  for(const d in S.daily) if(d<dcut) delete S.daily[d];
  S.log=S.log.filter(x=>x.d>=lcut);
  S.editedAt=Date.now();
  dropUndo();
  persistLocal();schedulePush();
}
// The daily reset must not stamp an edit time: otherwise a device that was
// closed yesterday would look newer than the server and overwrite it on sync.
// Every device runs the same reset, so it doesn't need to be pushed.
function rollover(){
  if(S.day===today()) return;
  const last=S.day;
  S.quests=S.quests.filter(q=>!isDone(q));
  S.day=today();
  // A repeat that fell on a day the app wasn't opened still turns up (looking back up to a month).
  let d=last<shift(today(),-30)?shift(today(),-30):shift(last,1);
  for(;d<=today();d=shift(d,1)){
    const [y,m,dd]=d.split('-').map(Number),wd=new Date(y,m-1,dd).getDay(),end=new Date(y,m,0).getDate();
    S.templates.forEach(t=>{
      const hit=t.days.includes(wd)||(t.monthDay&&(t.monthDay===dd||(t.monthDay>end&&dd===end)));
      if(hit&&!S.quests.some(q=>q.tpl===t.id||q.text===t.text)){const q=inst(t);q.tpl=t.id;S.quests.push(q);}
    });
  }
  persistLocal();
}

/* tree helpers */
function isDone(n){
  if(!n.children.length) return n.done;
  const req=n.children.filter(c=>!c.opt);
  return (req.length?req:n.children).every(isDone);
}
function frac(n){
  if(!n.children.length) return isDone(n)?1:0;
  const req=n.children.filter(c=>!c.opt), set=req.length?req:n.children;
  return set.reduce((a,c)=>a+frac(c),0)/set.length;
}
function find(id,arr=S.quests,parents=[]){
  for(const n of arr){
    if(n.id===id) return {n,arr,parents};
    const r=find(id,n.children,[...parents,n]); if(r) return r;
  }
  return null;
}
function ids(n,out=[]){out.push(n.id);n.children.forEach(c=>ids(c,out));return out;}
function count(n){return n.children.reduce((a,c)=>a+1+count(c),0);}
function nextLeaf(n){
  for(const c of n.children){
    if(isDone(c)) continue;
    if(!c.children.length) return c;
    const r=nextLeaf(c); if(r) return r;
  }
  return null;
}
function snapshot(){
  const m=new Map();
  (function w(ns,trail){ns.forEach(n=>{m.set(n.id,{done:isDone(n),top:!trail.length,text:n.text,trail});w(n.children,[...trail,n.text]);});})(S.quests,[]);
  return m;
}
// Finished quests sink below open ones at every level; open ones keep their order,
// so the top open quest is always "Next up".
function sinkDone(ns){
  const open=ns.filter(n=>!isDone(n)),done=ns.filter(isDone);
  ns.splice(0,ns.length,...open,...done);
  ns.forEach(n=>sinkDone(n.children));
}
function settle(before){
  sinkDone(S.quests);
  const after=snapshot();let gain=0;
  after.forEach((v,id)=>{if(!before.has(id))return;const was=before.get(id).done;const pts=v.top?30:10;
    if(v.done&&!was){gain+=pts;S.log.push({id,d:today(),text:v.text,trail:v.trail});}
    if(!v.done&&was){gain-=pts;S.log=S.log.filter(x=>!(x.id===id&&x.d===today()));}
  });
  if(gain){addXP(gain);if(gain>0)beep([659,988]);}
  if(S.quests.length&&S.quests.every(isDone)&&S.bonusDay!==today()){S.bonusDay=today();addXP(50);toast('Stage clear!');beep([523,659,784,1047,784,1047]);}
  save();renderAll();
}
const spent=n=>{const set=new Set(ids(n));return S.sessions.filter(s=>set.has(s.q)).reduce((a,s)=>a+s.mins,0);};
function dueSoon(){
  const out=[],lim=shift(today(),3);
  (function w(ns,trail){ns.forEach(n=>{if(isDone(n))return;const t=[...trail,n.text];if(n.due&&n.due<=lim)out.push({n,t});w(n.children,t);});})(S.quests,[]);
  return out.sort((a,b)=>a.n.due<b.n.due?-1:a.n.due>b.n.due?1:0).slice(0,5);
}
const strip=n=>({text:n.text,tag:n.tag,opt:n.opt,notes:n.notes,children:n.children.map(strip)});
const inst=t=>fix({id:uid(),text:t.text,tag:t.tag,opt:t.opt,notes:t.notes,children:t.children.map(inst)});

/* repeating quests: a quest repeats through a template linked by n.tpl */
const repeats=t=>!!t&&(t.days.length>0||t.monthDay>0);
const tplFor=n=>n.tpl?S.templates.find(t=>t.id===n.tpl):null;
const ord=n=>n+([11,12,13].includes(n%100)?'th':['th','st','nd','rd'][n%10]||'th');
function repLabel(t){
  const ds=WEEK.filter(i=>t.days.includes(i)),p=[];
  if(ds.length===7) p.push('Daily');
  else if(ds.length===5&&[1,2,3,4,5].every(i=>ds.includes(i))) p.push('Weekdays');
  else if(ds.length) p.push(ds.map(i=>WD[i]).join(' '));
  if(t.monthDay) p.push('Monthly on the '+ord(t.monthDay));
  return p.join(', ');
}
// Change how a quest repeats. The repeat copies the quest as it is now, subquests included.
function setRepeat(n,fn){
  let t=tplFor(n)||S.templates.find(x=>x.text===n.text);
  if(!t){t={id:uid(),days:[],monthDay:0,auto:true};S.templates.push(t);}
  n.tpl=t.id;
  Object.assign(t,strip(n));fn(t);
  if(t.auto&&!repeats(t)){S.templates=S.templates.filter(x=>x!==t);delete n.tpl;}
  save();renderAll();
}

/* feedback */
// XP is still counted (and synced) but no longer shown, so it can come back as a setting.
function addXP(n){S.xp=Math.max(0,S.xp+n);}
let tt,undoSnap=null;
function toast(msg,undo,ms){
  const t=$('#toast');t.innerHTML=esc(msg)+(undo?'<button id="undo">Undo</button>':'');
  t.classList.toggle('act',!!undo);t.classList.add('show');clearTimeout(tt);
  tt=setTimeout(()=>{t.classList.remove('show','act');if(undo)undoSnap=null;},ms||(undo?5000:1600));
}
// Run a destructive change and offer to put everything back for a few seconds.
function withUndo(msg,fn){const snap=JSON.stringify(S);fn();undoSnap=snap;toast(msg,true);}
function dropUndo(){if(!undoSnap)return;undoSnap=null;$('#toast').classList.remove('show','act');}
function undo(){
  const snap=undoSnap;dropUndo();if(!snap)return;
  norm(JSON.parse(snap));save();renderAll();toast('Undone');
}
let ac;
function beep(notes){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.06;o.connect(g).connect(ac.destination);const t=ac.currentTime+i*.09;o.start(t);o.stop(t+.08);});
  }catch(e){}
}
function arm(b,label){
  if(b.classList.contains('armed')) return true;
  b.classList.add('armed');b.dataset.orig=b.textContent;b.textContent=label;
  setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=b.dataset.orig;}},3000);
  return false;
}

/* header */
// The first unfinished step of the first unfinished quest, in list order.
function nextStep(){
  for(const q of S.quests){
    if(isDone(q)) continue;
    const n=q.children.length?nextLeaf(q):q;
    if(n) return {n,q};
  }
  return null;
}
function renderHeader(){
  let h;
  if(S.timer&&view!=='focus'){
    const t=S.timer,paused=t.left!=null;
    h=`<button class="go" data-v="focus"><span class="clk" id="hclock">${mmss(remaining())}</span><small>${paused?'Paused · ':''}${esc(timerLabel(t))}</small></button><button class="btn ${paused?'green':'blue'}" data-pause="1">${paused?'Resume':'Pause'}</button>`;
  }else{
    const nx=nextStep();
    if(nx) h=`<button class="check" data-toggle="${nx.n.id}" aria-label="Mark done: ${esc(nx.n.text)}">${tick}</button><button class="go" data-open="${nx.n.id}"><small>Next up${nx.n!==nx.q?' in '+esc(nx.q.text):''}</small><b>${esc(nx.n.text)}</b></button>`;
    else h=`<button class="go" data-v="today"><small>Next up</small><b>${S.quests.length?'All done for today':'Nothing planned yet'}</b></button>`;
  }
  $('#hnow').innerHTML=h;
  const qs=S.quests,done=qs.filter(isDone).length,p=qs.length?Math.round(done/qs.length*100):0;
  $('#hfill').style.width=p+'%';
  $('#hprog').setAttribute('aria-valuenow',p);
  const t=today();let late=0,due=0;
  (function w(ns){ns.forEach(n=>{if(isDone(n))return;if(n.due&&n.due<t)late++;else if(n.due===t)due++;w(n.children);});})(qs);
  const focus=Object.values(S.daily[t]||{}).reduce((a,b)=>a+b,0);
  let st=`<button data-v="today">${done} / ${qs.length} quests done</button><button data-v="focus">${hm(focus)} focus today</button>`;
  if(late) st+=`<button class="warn" data-v="today">${late} overdue</button>`;
  if(due) st+=`<button class="warn" data-v="today" style="background:var(--orange)">${due} due today</button>`;
  $('#hstats').innerHTML=st;
  const b=$('#inboxBadge');b.hidden=!S.inbox.length;b.textContent=S.inbox.length;
  renderSyncBadge();
}

/* today / drill-down */
let path=[],reorder=false,pending=null;
const panels={};  // which <details> panels are expanded, so re-renders keep them open
const tick='<svg viewBox="0 0 6 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1D2B53" d="M5 1h1v1H5zM4 2h1v1H4zM3 3h1v1H3zM0 3h1v1H0zM1 4h1v1H1zM2 4h1v1H2z"/></svg>';
function dueTag(n){
  if(!n.due||isDone(n)) return '';
  const t=today(),cls=n.due<t?'late':n.due===t?'now':'due';
  return `<span class="tag ${cls}">${n.due<t?'Overdue':n.due===t?'Due today':'Due '+niceDate(n.due)}</span>`;
}
function row(n,i,len,sib){
  const d=isDone(n),kids=n.children.length;
  let left;
  if(kids){
    const req=n.children.filter(c=>!c.opt),set=req.length?req:n.children,p=Math.round(frac(n)*100);
    left=`<button class="meter" data-open="${n.id}" aria-label="${p}% complete" style="background:linear-gradient(to top,var(--green) ${p}%,var(--bg) ${p}%)">${set.filter(isDone).length}/${set.length}</button>`;
  }else{
    left=`<button class="check" data-toggle="${n.id}" aria-pressed="${d}" aria-label="Mark done: ${esc(n.text)}">${tick}</button>`;
  }
  const nx=kids&&!d?nextLeaf(n):null;
  const rt=tplFor(n);
  const meta=tagBadge(n.tag)+(n.opt?'<span class="tag opt">Optional</span>':'')+(repeats(rt)?`<span class="tag rep">Repeats ${esc(repLabel(rt))}</span>`:'')+dueTag(n)+(nx?'Next: '+esc(nx.text):'');
  const right=reorder
    ?`${d?'':`<button class="mv" data-top="${n.id}" aria-label="Move to top" ${i===0?'disabled':''}>Top</button>`}<button class="mv" data-up="${n.id}" aria-label="Move up" ${i===0||(d&&!isDone(sib[i-1]))?'disabled':''}>&#9650;</button><button class="mv" data-down="${n.id}" aria-label="Move down" ${i===len-1||(!d&&isDone(sib[i+1]))?'disabled':''}>&#9660;</button>`
    :`<span class="chev" aria-hidden="true">&gt;</span><button class="x" data-del="${n.id}" aria-label="Delete ${esc(n.text)}">×</button>`;
  return `<div class="row box${d?' done':''}">${left}<button class="open" data-open="${n.id}"><span>${esc(n.text)}</span>${meta?'<small>'+meta+'</small>':''}</button>${right}</div>`;
}
function list(ns){
  let h='';
  if(ns.length>1) h+=`<div class="listbar"><button class="linkbtn" id="reorder">${reorder?'Done reordering':'Reorder'}</button></div>`;
  ns.forEach((c,i)=>h+=row(c,i,ns.length,ns));
  return h;
}
function renderToday(){
  path=path.filter((id,i)=>{const r=find(id);return r&&(i===0?S.quests.includes(r.n):find(path[i-1]).n.children.includes(r.n));});
  if(path.length) return renderNode(find(path[path.length-1]));
  const qs=S.quests;
  let h='';
  const soon=dueSoon();
  if(soon.length){
    h+='<div class="soon box"><h2>Due soon</h2>';
    soon.forEach(({n,t})=>h+=`<button class="soonrow" data-open="${n.id}"><span>${esc(t.join(' / '))}</span>${dueTag(n)}</button>`);
    h+='</div>';
  }
  h+='<h2>Today\'s quests</h2>';
  if(qs.length&&qs.every(isDone)) h+='<div class="clear"><b>Stage clear!</b>Everything on today\'s list is done.</div>';
  h+=list(qs);
  h+='<form class="addrow" id="qform"><input id="qin" maxlength="120" placeholder="Add a quest" aria-label="New quest" autocomplete="off"><button class="btn">Add</button></form>';
  const own=S.templates.filter(t=>!t.auto);
  if(own.length){
    h+='<div class="tpls"><span class="hint" style="margin:0">From a template:</span>';
    own.forEach(t=>h+=`<span class="tchip"><button data-tpl="${t.id}">${esc(t.text)} (${count(t)})</button><button class="tdel" data-deltpl="${t.id}" aria-label="Delete template ${esc(t.text)}">×</button></span>`);
    h+='</div>';
  }
  if(S.templates.length){
    h+=`<details id="repd" style="margin:-4px 0 18px"${panels.repd?' open':''}><summary>Repeating quests</summary>`;
    S.templates.forEach(t=>{
      h+=`<div class="rep"><span>${esc(t.text)}${t.monthDay?` <small class="hint">(also monthly on the ${ord(t.monthDay)})</small>`:''}</span><div class="days">`;
      WEEK.forEach(i=>h+=`<button class="day" data-rep="${t.id}" data-wd="${i}" aria-pressed="${t.days.includes(i)}" aria-label="${WD[i]}">${WD[i].slice(0,2)}</button>`);
      h+='</div></div>';
    });
    h+='</details>';
  }
  if(!qs.length) h+='<div class="slot">No quests yet.</div>';
  $('#v-today').innerHTML=h;
}
function renderNode({n,parents}){
  const d=isDone(n),kids=n.children.length,top=!parents.length;
  let h=`<button class="btn back" data-crumb="${parents.length-1}">&lt; Back</button><div class="crumbs" role="navigation" aria-label="Breadcrumb"><button data-crumb="-1">Today</button>`;
  parents.forEach((p,i)=>h+=`<span>/</span><button data-crumb="${i}">${esc(p.text)}</button>`);
  h+=`<span>/</span><b>${esc(n.text)}</b></div><div class="node box"><h1>${esc(n.text)}</h1>${top?tagPicker('q',n.id,n.tag):''}`;
  if(kids){
    const req=n.children.filter(c=>!c.opt),set=req.length?req:n.children,p=Math.round(frac(n)*100),opt=n.children.length-req.length;
    h+=`<div>${set.filter(isDone).length} / ${set.length} complete (${p}%)${req.length&&opt?' + '+opt+' optional':''}</div><div class="prog"><div style="width:${p}%"></div></div>`;
  }
  const m=spent(n),meta=(n.opt?'<span class="tag opt">Optional</span>':'')+dueTag(n)+(m?'Focus time: '+hm(m):'');
  if(meta) h+=`<div style="margin-top:8px">${meta}</div>`;
  h+='<div class="acts">';
  if(!kids) h+=`<button class="btn ${d?'':'green'}" data-toggle="${n.id}">${d?'Mark not done':'Mark done'}</button>`;
  h+=`${d?'':`<button class="btn blue" data-focuson="${n.id}">Focus on this</button>`}</div>`;
  h+=`<div class="links"><button class="linkbtn" data-savetpl="${n.id}">Save as template</button><button class="linkbtn" data-toinbox="${n.id}">Move to inbox</button><button class="dellink" data-del="${n.id}">Delete this quest</button></div>`;
  h+=`<details${n.notes?' open':''}><summary>Notes and deadline</summary>
    <label class="f" for="fname">Name</label><input class="fld" id="fname" data-field="text" data-id="${n.id}" value="${esc(n.text)}" maxlength="120">
    <label class="f" for="fdue">Deadline</label><input class="fld" type="date" id="fdue" data-field="due" data-id="${n.id}" value="${n.due}">
    <label class="f" for="fnotes">Notes</label><textarea class="fld" id="fnotes" data-field="notes" data-id="${n.id}">${esc(n.notes)}</textarea>
    ${top?'':`<label class="optbox"><input type="checkbox" data-field="opt" data-id="${n.id}" ${n.opt?'checked':''}>Optional</label>`}
    </details>`;
  if(top){
    const t=tplFor(n),on=repeats(t),days=on?t.days:[],md=on?t.monthDay:0;
    const preset=(k,l,p)=>`<button class="chip" data-rpreset="${k}" data-id="${n.id}" aria-pressed="${p}">${l}</button>`;
    h+=`<details id="rptd"${panels.rptd?' open':''}><summary>Repeat: ${on?esc(repLabel(t)):'off'}</summary>
      <div class="chips" style="margin-bottom:10px">${preset('daily','Every day',days.length===7)}${preset('weekdays','Weekdays',repLabel({days,monthDay:0})==='Weekdays')}${preset('off','Off',!on)}</div>
      <div class="days">${WEEK.map(i=>`<button class="day" data-rday="${i}" data-id="${n.id}" aria-pressed="${days.includes(i)}" aria-label="${WD[i]}">${WD[i].slice(0,2)}</button>`).join('')}</div>
      <label class="f" for="fmonth">Also monthly, on day</label><select class="fld" id="fmonth" data-field="month" data-id="${n.id}"><option value="0">Not monthly</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}"${md===i+1?' selected':''}>${ord(i+1)}${i+1>28?' (or last day)':''}</option>`).join('')}</select>
      </details>`;
  }
  h+='</div>';
  h+='<h2>Subquests</h2>';
  h+=list(n.children);
  h+=`<form class="addrow" id="sform" data-parent="${n.id}"><input id="sin" maxlength="120" placeholder="Add a subquest" aria-label="New subquest" autocomplete="off"><button class="btn">Add</button></form>
    <label class="optbox" style="margin-top:-4px"><input type="checkbox" id="sopt">Add as optional</label>`;
  $('#v-today').innerHTML=h;
}

/* inbox */
const expanded=new Set();  // inbox items showing their subquest editor
function renderInbox(){
  let h='<h2>Inbox</h2>';
  h+=`<form class="addrow" id="iform"><input id="iin" maxlength="600" placeholder="Capture a thought" aria-label="New inbox item" autocomplete="off">${mic?`<button type="button" class="btn mic${listening?' on':''}" id="mic" aria-label="${listening?'Stop listening':'Speak to capture'}" aria-pressed="${listening}">${micIcon}</button>`:''}<button class="btn pink">Add</button></form>`;
  if(!S.inbox.length) h+='<div class="empty">Inbox empty.</div>';
  S.inbox.forEach(it=>{
    const kids=it.node?it.node.children:[],c=it.node?count(it.node):0,open=expanded.has(it.id);
    h+=`<div class="item box"><p>${esc(it.text)} ${tagBadge(it.tag)}${c?`<span class="tag opt">${c} subquest${c===1?'':'s'}</span>`:''}<br><button class="linkbtn" data-steps="${it.id}" aria-expanded="${open}">${open?'Hide':'Tag and subquests'}</button></p>`;
    if(open){
      h+=tagPicker('i',it.id,it.tag);
      if(kids.length){
        h+='<ul class="subs">';
        kids.forEach(k=>h+=`<li><span>${esc(k.text)}${k.children.length?` <small class="hint">(${count(k)} more)</small>`:''}</span><button class="x" data-delsub="${it.id}" data-sub="${k.id}" aria-label="Remove ${esc(k.text)}">×</button></li>`);
        h+='</ul>';
      }
      h+=`<form class="addrow" data-subfor="${it.id}"><input maxlength="120" placeholder="Add a subquest" aria-label="New subquest for ${esc(it.text)}" autocomplete="off"><button class="btn">Add</button></form>`;
    }
    h+=`<div class="row" style="padding:0;margin:0"><button class="btn blue" data-promote="${it.id}">Move to today</button><button class="btn green" data-clear="${it.id}">Clear</button></div></div>`;
  });
  $('#v-inbox').innerHTML=h;
}
// "call Sam next item book dentist" -> two items. Also splits on new lines.
const splitItems=v=>v.split(/\bnext item\b[,.;:]?|\n/i).map(x=>x.trim().replace(/^[,.;:]\s*/,'')).filter(Boolean).map(x=>x.slice(0,200));
function capture(v){
  const items=splitItems(v);if(!items.length)return 0;
  items.reverse().forEach(t=>S.inbox.unshift({id:uid(),text:t[0].toUpperCase()+t.slice(1)}));
  save();renderAll();beep([880]);
  return items.length;
}

/* voice capture: browsers with speech recognition only */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
// iPhone home-screen apps have a broken recogniser; keyboard dictation works there instead.
const mic=!!SR&&!navigator.standalone;
const micIcon='<svg viewBox="0 0 7 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h3v5H2zM0 3h1v2H0zM6 3h1v2H6zM1 5h5v1H1zM3 6h1v1H3zM1 7h5v1H1z"/></svg>';
let listening=false,rec=null;
function toggleMic(){
  if(listening){rec&&rec.stop();return;}
  let heard='';
  try{
    rec=new SR();rec.lang=navigator.language||'en-GB';rec.interimResults=true;rec.continuous=false;
  }catch(e){toast('Voice isn\'t available here');return;}
  rec.onresult=e=>{
    heard=[...e.results].map(r=>r[0].transcript).join(' ');
    const i=$('#iin');if(i)i.value=heard;
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed') toast('Microphone blocked. Allow it in browser settings',false,3000);
    else if(e.error==='no-speech') toast('Didn\'t catch that');
    else if(e.error!=='aborted') toast('Voice didn\'t work, try again');
  };
  rec.onend=()=>{
    listening=false;rec=null;
    const n=heard.trim()?capture(heard):0;
    renderInbox();
    if(n) toast(n>1?'Added '+n+' items':'Added');
  };
  try{rec.start();listening=true;renderInbox();}catch(e){listening=false;toast('Voice didn\'t work, try again');}
}

/* focus */
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60);};
const hm=m=>m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m';
const remaining=()=>S.timer.left!=null?S.timer.left:S.timer.end-Date.now();
const timerDue=()=>!!S.timer&&S.timer.left==null&&Date.now()>=S.timer.end;
const tagColor=name=>{const t=S.tags.find(x=>x.name===name);return t?t.color:'#C2C3C7';};
let range=7;
const tagBadge=name=>name?`<span class="tag" style="background:${tagColor(name)}">${esc(name)}</span>`:'';
function tagPicker(kind,id,cur){
  let h='<div class="chips tagpick">';
  S.tags.forEach(t=>h+=`<button class="chip" style="--c:${t.color}" data-settag="${esc(t.name)}" data-kind="${kind}" data-id="${id}" aria-pressed="${cur===t.name}">${esc(t.name)}</button>`);
  return h+'<button class="linkbtn" data-edittags="1">Edit tags</button></div>';
}
const topOf=id=>{const r=id&&find(id);return r?(r.parents[0]||r.n):null;};
const timerLabel=t=>{const q=t.q&&find(t.q);return [t.tag,q&&q.n.text].filter(Boolean).join(': ');};
// What the next session is for: the quest picked here, else the header's "Next up".
function focusTarget(){
  if(S.focusQ==='none') return null;
  if(S.focusQ&&find(S.focusQ)&&!isDone(find(S.focusQ).n)) return S.focusQ;
  const nx=nextStep();return nx?nx.n.id:null;
}
function renderFocus(){
  let h='<h2>Focus</h2>';
  if(S.timer){

function renderStats(){
  const since=shift(today(),-(range-1)),tot={};let sum=0;
  for(const d in S.daily) if(d>=since) for(const t in S.daily[d]){tot[t]=(tot[t]||0)+S.daily[d][t];sum+=S.daily[d][t];}
  const rows=Object.keys(tot).filter(k=>tot[k]>0).map(k=>[k||'Untagged',k?tagColor(k):'var(--muted)',tot[k]]).sort((a,b)=>b[2]-a[2]);
  const max=Math.max(1,...rows.map(r=>r[2]));
  let h='<div class="bars box" style="margin:0 0 22px"><div class="chips rng">';
  [[7,'Week'],[30,'Month'],[365,'Year']].forEach(([n,l])=>h+=`<button class="chip" data-range="${n}" aria-pressed="${range===n}">${l}</button>`);
  h+=`</div><h2>Focus, last ${range} days: ${hm(sum)}</h2>`;
  if(sum) h+=`<p class="hint" style="margin:0">About ${hm(Math.round(sum/range))} a day</p>`;
  rows.forEach(([t,c,m])=>{h+=`<div class="bar"><span>${esc(t)}</span><div class="track"><div style="width:${m/max*100}%;background:${c}"></div></div><span>${hm(m)}</span></div>`;});
  return h+'</div>';
}
function logSession(tag,mins,t,q){S.sessions.push({tag,mins,t,q:q||null});addDaily(fmt(new Date(t)),tag,mins);}
function finishTimer(silent){

function stopAndSave(done){

// Every quest, inbox item and template, for tag renames and deletes.
function eachTagged(fn){
  const w=n=>{fn(n);(n.children||[]).forEach(w);};
  S.quests.forEach(w);S.templates.forEach(w);S.inbox.forEach(i=>{fn(i);if(i.node)w(i.node);});

function renameTag(i,v){
  const old=S.tags[i].name;v=v.trim();
  if(!v||v===old) return;
  if(S.tags.some(t=>t.name===v)){toast('That tag already exists');return;}
  S.tags[i].name=v;
  eachTagged(n=>{if(n.tag===old)n.tag=v;});
  S.sessions.forEach(x=>{if(x.tag===old)x.tag=v;});
  for(const d in S.daily){const o=S.daily[d];if(old in o){o[v]=(o[v]||0)+o[old];delete o[old];}}
  if(S.timer&&S.timer.tag===old) S.timer.tag=v;
}

const CFG=self.COCKPIT_CONFIG||{};
let sb=null,session=null,syncStatus='',lastSync=0,pushT=null,authMsg='',syncing=false,again=false;
try{
  if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase)
    sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}catch(e){sb=null;}
function setSync(s){syncStatus=s;renderSyncBadge();if(view==='account')renderAccount();}
function badgeText(){
  if(!sb) return 'Sync off';
  if(!session) return 'Sign in to sync';
  return {syncing:'Syncing',ok:'Synced',offline:'Offline',error:'Sync error'}[syncStatus]||'Synced';
}
function renderSyncBadge(){const b=$('#syncBtn');if(!b)return;b.textContent=badgeText();b.dataset.state=(!sb||!session)?'off':syncStatus;}
function schedulePush(){if(!sb||!session)return;clearTimeout(pushT);pushT=setTimeout(sync,1200);}
async function sync(){
  if(!sb||!session) return;
  if(syncing){again=true;return;}
  if(!navigator.onLine){setSync('offline');return;}
  syncing=true;setSync('syncing');
  try{
    const uid_=session.user.id;
    const {data,error}=await sb.from('cockpit_state').select('data,edited_at').eq('user_id',uid_).maybeSingle();
    if(error) throw error;
    const remoteAt=data?Number(data.edited_at):0, localAt=S.editedAt||0;
    if(data&&remoteAt>localAt){
      dropUndo();norm(data.data);S.editedAt=remoteAt;persistLocal();rollover();renderAll();
    }else if(localAt>remoteAt||!data){
      const {error:e2}=await sb.from('cockpit_state').upsert({user_id:uid_,data:S,edited_at:localAt,updated_at:new Date().toISOString()});
      if(e2) throw e2;
    }
    lastSync=Date.now();setSync('ok');
  }catch(e){console.warn('sync failed',e);setSync(navigator.onLine?'error':'offline');}
  finally{syncing=false;if(again){again=false;sync();}}
}

  if(d.settag!==undefined){
    const v=d.settag;
    if(d.kind==='q'){const r=find(d.id);if(r){r.n.tag=r.n.tag===v?'':v;const t=tplFor(r.n);if(t)t.tag=r.n.tag;}}
    else{const it=S.inbox.find(x=>x.id===d.id);if(it){it.tag=it.tag===v?'':v;if(it.node)it.node.tag=it.tag;}}
    save();renderAll();
  }
  if(d.edittags){renderAccount();go('account');const t=$('#tagsec');t&&t.scrollIntoView();}
  if(d.deltag){
    if(!arm(b,'Delete?'))return;
    withUndo('Tag deleted',()=>{const name=S.tags[+d.deltag].name;S.tags.splice(+d.deltag,1);eachTagged(n=>{if(n.tag===name)n.tag='';});save();renderAll();});
  }
  if(d.range){range=+d.range;renderLog();}
  if(d.mins){S.mins=+d.mins;save();renderFocus();}
  if(b.id==='start'){const q=focusTarget(),top=topOf(q);askNotify();beep([440]);S.timer={end:Date.now()+S.mins*60000,tag:top?top.tag:'',mins:S.mins,q};save();renderHeader();renderFocus();}
  if(b.id==='plus5'){const t=S.timer;if(!t)return;t.mins+=5;if(t.left!=null)t.left+=300000;else t.end+=300000;save();renderFocus();}
  if(b.id==='stop'){if(!arm(b,'Tap again to discard'))return;S.timer=null;save();renderHeader();renderFocus();}
  if(b.id==='stopsave') stopAndSave(false);
  if(b.id==='stopdone') stopAndSave(true);
  if(d.pause){const t=S.timer;if(!t)return;if(t.left!=null){t.end=Date.now()+t.left;delete t.left;}else t.left=Math.max(0,t.end-Date.now());save();renderHeader();renderFocus();}
  if(b.id==='undo') undo();
  if(b.id==='copylog') copyLog();
  if(b.id==='hist') loadHistory();
  if(d.hist){const r=history.find(x=>String(x.id)===d.hist);if(r&&r.data&&Array.isArray(r.data.quests)){pending=r.data;renderAccount();window.scrollTo(0,0);}}
  if(b.id==='exp') exportData();
  if(b.id==='doRestore'){norm(pending);pending=null;path=[];save();renderAll();toast('Backup restored');go('today');}
  if(b.id==='noRestore'){pending=null;renderAccount();}
  if(b.id==='syncBtn'){renderAccount();go('account');}
  if(b.id==='signup') signUp();
  if(b.id==='signout'){sb.auth.signOut().then(()=>{session=null;syncStatus='';history=null;renderSyncBadge();renderAccount();});}
  if(b.id==='syncNow') sync();
});

document.addEventListener('toggle',e=>{if(e.target.id)panels[e.target.id]=e.target.open;},true);

/* keyboard shortcuts (desktop) */
const KEYS='n new quest · i capture · t today · f focus · l history · s settings · p pause · Esc back';
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const el=e.target;
  if(el.closest&&el.closest('input,textarea,select,[contenteditable]')){if(e.key==='Escape')el.blur();return;}
  const k=e.key,field=id=>{const f=$(id);if(!f)return false;e.preventDefault();f.focus();return true;};
  if(k==='n'){go('today');field('#sin')||field('#qin');}
  else if(k==='i'){go('inbox');field('#iin');}
  else if(k==='t'){if(view==='today'&&path.length)openPath([]);go('today');}
  else if(k==='f') go('focus');
  else if(k==='l') go('log');
  else if(k==='p'&&S.timer){const b=$('[data-pause]');if(b)b.click();}
  else if(k==='?') toast(KEYS,false,5000);
  else if(k==='s') go('account');
  else if(k==='Escape'){if(view==='today'&&path.length)openPath(path.slice(0,-1));}
});

document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollover();if(timerDue())finishTimer(true);else renderAll();sync();}});
window.addEventListener('online',()=>sync());
window.addEventListener('offline',()=>{if(session)setSync('offline');});
setInterval(()=>{if(!document.hidden)sync();},60000);

load();rollover();
if(timerDue()) finishTimer(true); else renderAll();
if(sb){
  sb.auth.onAuthStateChange((ev,s)=>{
    session=s;renderSyncBadge();if(view==='account')renderAccount();
    if(s&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'))setTimeout(sync,0);
  });
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
