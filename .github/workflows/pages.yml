# Publishes the app to GitHub Pages on every push to main, stamping a fresh
# service worker VERSION so installed copies always pick up the update.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp service worker version
        run: |
          sed -i "s/^const VERSION = '.*';/const VERSION = 'dashboard-${GITHUB_SHA::7}';/" sw.js
          grep -q "dashboard-${GITHUB_SHA::7}" sw.js
          rm -rf .github tests node_modules package.json package-lock.json playwright.config.js .prettierrc .gitignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
